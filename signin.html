<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | VENDORA AFRICA</title>
    <style>
        :root {
            --primary: #1B4F72;
            --primary-dark: #154060;
            --blue: #2E86C1;
            --ink: #1E2A39;
            --muted: #5D6B7A;
            --border: #D9E3EB;
            --surface: #ffffff;
            --background: #f4f8fb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(27, 79, 114, 0.92), rgba(46, 134, 193, 0.84)),
                url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover;
        }

        a { color: inherit; text-decoration: none; }

        .nav {
            min-height: 70px;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            color: var(--primary);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .logo span { color: var(--blue); }

        .back-link {
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
        }

        .page {
            min-height: calc(100vh - 70px);
            display: grid;
            place-items: center;
            padding: 48px 20px;
        }

        .card {
            width: min(100%, 460px);
            padding: 36px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(10, 45, 70, 0.24);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 12px;
            border-radius: 999px;
            background: #E6F1FB;
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: clamp(2rem, 5vw, 2.7rem);
            line-height: 1.12;
        }

        .intro {
            margin: 0 0 28px;
            color: var(--muted);
            line-height: 1.65;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--ink);
            background: #fff;
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(46, 134, 193, 0.16);
            border-color: var(--blue);
        }

        .password-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .password-row label { margin: 0; }

        .forgot-link {
            color: var(--blue);
            font-size: 13px;
            font-weight: 700;
        }

        .submit {
            width: 100%;
            margin-top: 6px;
            padding: 14px 18px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: var(--primary);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .submit:hover { background: var(--primary-dark); }
        .submit:disabled { cursor: wait; opacity: 0.7; }

        .message {
            min-height: 22px;
            margin: 16px 0 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error { color: #b42318; }
        .message.success { color: #28743a; }

        .register-prompt {
            margin: 26px 0 0;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            text-align: center;
            font-size: 14px;
        }

        .register-prompt a { color: var(--blue); font-weight: 700; }

        @media (max-width: 560px) {
            .nav { padding: 0 1rem; }
            .logo { font-size: 18px; }
            .card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <header class="nav">
        <a class="logo" href="index.html"><span>MT</span> VENDORA <span>AFRICA</span></a>
        <a class="back-link" href="index.html">Back to home</a>
    </header>

    <main class="page">
        <section class="card" aria-labelledby="signin-title">
            <span class="eyebrow">Welcome back</span>
            <h1 id="signin-title">Sign in to VENDORA AFRICA</h1>
            <p class="intro">Sign in as a customer to discover local businesses, or as a business owner to manage your presence on VENDORA AFRICA.</p>

            <form id="signinForm">
                <div class="form-group">
                    <label for="role">I am signing in as</label>
                    <select id="role" name="role" required>
                        <option value="customer">Customer</option>
                        <option value="business">Business owner</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
                </div>

                <div class="form-group">
                    <div class="password-row">
                        <label for="password">Password</label>
                        <a class="forgot-link" href="mailto:support@vendora.africa?subject=Password%20help">Forgot password?</a>
                    </div>
                    <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Enter your password" />
                </div>

                <button class="submit" type="submit">Sign in</button>
                <p id="message" class="message" role="status" aria-live="polite"></p>
            </form>

            <p class="register-prompt">New to VENDORA AFRICA? <a href="register.html">Register your business free</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById('signinForm');
        const submitButton = form.querySelector('button[type="submit"]');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            message.className = 'message';
            submitButton.disabled = true;
            submitButton.textContent = 'Signing in...';

            const formData = new FormData(form);
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: formData.get('email'),
                        password: formData.get('password'),
                        role: formData.get('role')
                    })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unable to sign in. Please try again.');
                }

                localStorage.setItem('vendoraToken', data.token);
                localStorage.setItem('vendoraEmail', formData.get('email'));
                localStorage.setItem('vendoraRole', data.role);
                message.textContent = 'Signed in successfully. Redirecting...';
                message.className = 'message success';
                window.setTimeout(() => { window.location.href = 'browse.html'; }, 700);
            } catch (error) {
                message.textContent = error.message;
                message.className = 'message error';
                submitButton.disabled = false;
                submitButton.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
