<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vendora Africa mark: white shopping bag with a navy "V". Used on transparent backgrounds. -->
  <defs>
    <linearGradient id="vGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A55"/>
      <stop offset="1" stop-color="#1F6FA3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06141F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <!-- handle -->
    <path d="M392 372 V318 a120 120 0 0 1 240 0 V372" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <!-- bag body -->
    <path d="M250 372 H774 a28 28 0 0 1 28 30 L776 768 a64 64 0 0 1 -64 60 H312 a64 64 0 0 1 -64 -60 L222 402 a28 28 0 0 1 28 -30 Z" fill="#FFFFFF"/>
  </g>
  <!-- handle rivets -->
  <circle cx="392" cy="418" r="17" fill="#7CC4F2"/>
  <circle cx="632" cy="418" r="17" fill="#7CC4F2"/>
  <!-- V -->
  <path d="M352 480 H460 L512 650 L564 480 H672 L566 760 H458 Z" fill="url(#vGrad)"/>
</svg>
